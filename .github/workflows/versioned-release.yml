name: Versioned release (GitHub only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New semantic version, e.g. v1.0.0-rc.1"
        required: true
        type: string
      expected_sha:
        description: "Exact fully tested main commit SHA"
        required: true
        type: string
      enable_order_sms:
        description: "Expose order-only SMS opt-in in storefront (requires separately verified API and worker)"
        type: boolean
        default: false
      enable_hubtel_refresh:
        description: "Expose active hosted payment refresh (requires matching enabled API)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: variety-versioned-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require exact successful main CI and API verification
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          for workflow in ci.yml api.yml; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$EXPECTED_SHA&event=push&branch=main&status=success" --jq '[.workflow_runs[] | select(.head_sha == "'"$EXPECTED_SHA"'" and .head_branch == "main" and .conclusion == "success")] | length')
            test "$count" -gt 0 || { echo "$workflow has no successful exact-SHA main run"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build standalone portal in HTTP API mode
        env:
          API_BASE_URL: http://127.0.0.1:3049/api/v1
          NEXT_PUBLIC_API_BASE_URL: https://portal.varietygroceries.com/api/v1
          NEXT_PUBLIC_ORDER_SMS_OPT_IN_ENABLED: ${{ inputs.enable_order_sms && '1' || '0' }}
          NEXT_PUBLIC_HUBTEL_CUSTOMER_PAYMENT_REFRESH_ENABLED: ${{ inputs.enable_hubtel_refresh && '1' || '0' }}
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_TURBOPACK_EXPERIMENTAL_USE_SYSTEM_TLS_CERTS: '1'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
      - name: Build API and contracts without production credentials
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
        run: |
          set -euo pipefail
          npm ci --prefix packages/contracts
          npm run --prefix packages/contracts build
          npm ci --prefix apps/api
          npm run --prefix apps/api generate
          npm run --prefix apps/api prisma:client:check
          npm run --prefix apps/api build
          test -f apps/api/dist/src/main.js
          test -f apps/api/dist/scripts/run-order-sms.js
          test -f apps/api/dist/scripts/recover-hosted-payments.js
      - name: Assemble and inspect source-light runtime
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash scripts/ops/package-github-runtime.sh
          digest=$(sha256sum release-output/runtime.tar.gz | cut -d ' ' -f 1)
          python3 scripts/ops/verify-github-runtime.py release-output --sha "$GITHUB_SHA" --version "$VERSION" --archive-sha256 "$digest"
      - uses: actions/upload-artifact@v4
        with:
          name: versioned-runtime-${{ github.sha }}
          path: release-output/
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: versioned-runtime-${{ github.sha }}
          path: release-output
      - name: Store runtime and evidence permanently as a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ENABLE_ORDER_SMS: ${{ inputs.enable_order_sms }}
          ENABLE_HUBTEL_REFRESH: ${{ inputs.enable_hubtel_refresh }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          cd release-output
          sha256sum --check --strict SHA256SUMS
          test "$(cat source-sha.txt)" = "$GITHUB_SHA"
          test "$(cat version.txt)" = "$VERSION"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version already exists; never replace a historical release."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists; never move an existing version."
            exit 1
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Variety Groceries $VERSION" --notes "GitHub-built candidate for exact source $GITHUB_SHA. Storefront build flags: order SMS=$ENABLE_ORDER_SMS; active Hubtel refresh=$ENABLE_HUBTEL_REFRESH. Not deployed. Review runtime smoke, configuration parity, migration compatibility and acceptance evidence before publication or VPS installation." runtime.tar.gz SHA256SUMS source-sha.txt version.txt format.txt
