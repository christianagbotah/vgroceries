name: Patch legacy OpenAPI assertions

on:
  push:
    branches:
      - feat/fulfilment-handover-20261012
    paths:
      - .github/workflows/patch-foundation-openapi.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fulfilment-handover-20261012
      - run: python scripts/patch-foundation-openapi.py
      - run: git diff --check
      - name: Commit patched assertions
        run: |
          git config user.name "CHRISTIAN AGBOTAH"
          git config user.email "148919415+christianagbotah@users.noreply.github.com"
          git add apps/api/test/foundation.spec.ts
          git commit -m "test(api): refresh foundation OpenAPI assertions"
          git push origin HEAD:feat/fulfilment-handover-20261012
