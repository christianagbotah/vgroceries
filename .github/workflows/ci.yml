name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Task 4 pickup checkout UI patch
        run: node scripts/apply-task4-pickup-ui.mjs

      - name: Lint (ESLint)
        run: bun run lint

      - name: Type check (tsc --noEmit)
        run: bunx tsc --noEmit --incremental false

      - name: Production build
        env:
          NEXT_TURBOPACK_EXPERIMENTAL_USE_SYSTEM_TLS_CERTS: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

      - name: Start production server
        run: |
          NODE_ENV=production bun .next/standalone/server.js &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:3000/ >/dev/null

      - name: Domain regression suite (handoff defects)
        run: bun scripts/handoff-regressions.ts

      - name: Return stock and API boundary regressions
        run: bun test

      - name: Shared contracts suite (request/response schemas + registry)
        run: bun scripts/contracts-check.ts http://localhost:3000/api/mock/v1

      - name: Business-rule acceptance suite (hardened)
        run: bash scripts/acceptance-checks.sh

      - name: Route sweep
        run: bun scripts/route-sweep.mjs http://localhost:3000

      - name: Commit verified Task 4 checkout UI
        if: github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- 'src/app/(storefront)/checkout/page.tsx'; then
            echo "Task 4 checkout UI already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/(storefront)/checkout/page.tsx'
          git commit -m "feat(checkout): add pickup centre selection UI"
          git push origin HEAD:${{ github.head_ref }}
