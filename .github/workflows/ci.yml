name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Offline Hubtel access diagnostic tests (no provider requests)
        run: python3 -m unittest discover -s scripts -p 'test_hubtel_transaction_status_probe.py' -v

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Type check (tsc --noEmit)
        run: bunx tsc --noEmit --incremental false

      - name: Production build
        env:
          NEXT_TURBOPACK_EXPERIMENTAL_USE_SYSTEM_TLS_CERTS: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

      - name: Start production server
        run: |
          NODE_ENV=production bun .next/standalone/server.js &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:3000/ >/dev/null

      - name: Domain regression suite (handoff defects)
        run: bun scripts/handoff-regressions.ts

      - name: Return stock and API boundary regressions
        run: bun test

      - name: Shared contracts suite (request/response schemas + registry)
        run: bun scripts/contracts-check.ts http://localhost:3000/api/mock/v1

      - name: Business-rule acceptance suite (hardened)
        run: bash scripts/acceptance-checks.sh

      - name: Route sweep
        run: bun scripts/route-sweep.mjs http://localhost:3000

      - name: Install isolated Chromium browser test tools
        run: |
          npm install --prefix /tmp/vgroceries-playwright --no-save --no-audit --no-fund playwright-core@1.56.1
          npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Checkout browser retry acceptance (intercepted demo requests only)
        env:
          PLAYWRIGHT_CORE_PATH: /tmp/vgroceries-playwright/node_modules/playwright-core
        run: node scripts/checkout-browser-retry.mjs http://127.0.0.1:3000
