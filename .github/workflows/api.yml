name: API foundation
on:
  push:
    branches: [main, feat/product-media-ai-studio-20261014]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: variety_foundation_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d variety_foundation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/variety_foundation_test
      WEB_ORIGINS: http://localhost:3000
      API_STOCK_LOCATION_ID: loc_accra
      API_INSECURE_COOKIES: "true"
      COMMERCE_LOCATION_ID: loc_accra
      CHECKOUT_PAYMENT_HOLD_MINUTES: "15"
      CHECKOUT_OFFLINE_HOLD_MINUTES: "1440"
      GUEST_CHECKOUT_TTL_MINUTES: "1440"
      ORDER_VERIFICATION_ACTIVE_VERSION: "1"
      ORDER_VERIFICATION_KEYS: '{"1":"1111111111111111111111111111111111111111111111111111111111111111"}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build shared contracts
        run: |
          npm ci --prefix packages/contracts
          npm run --prefix packages/contracts build
      - name: Install and generate API client
        run: |
          npm ci --prefix apps/api
          npm run --prefix apps/api generate
      - name: Apply migrations to empty PostgreSQL
        run: npm run --prefix apps/api migrate:deploy
      - name: API integration and security tests
        run: npm test --prefix apps/api
      - name: Synchronize generated OpenAPI on feature-branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/product-media-ai-studio-20261014'
        run: |
          npm run --prefix apps/api openapi
          if git diff --quiet -- docs/openapi-foundation.json; then
            echo "OpenAPI contract already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi-foundation.json
          git commit -m "docs: sync generated OpenAPI contract"
          git push origin HEAD:${{ github.ref_name }}
      - name: Confirm production OpenAPI is deterministic and matches implementation
        working-directory: apps/api
        run: |
          npm run openapi
          cp ../../docs/openapi-foundation.json /tmp/openapi-first.json
          npm run openapi
          cmp /tmp/openapi-first.json ../../docs/openapi-foundation.json
          git diff --exit-code -- ../../docs/openapi-foundation.json
