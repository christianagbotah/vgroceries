name: L2 one-shot OpenAPI sync

on:
  push:
    branches: [feat/logistics-shipment-execution-l2-20261020]

permissions:
  contents: write

jobs:
  sync-openapi:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/logistics-shipment-execution-l2-20261020
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build shared contracts
        run: |
          npm ci --prefix packages/contracts
          npm run --prefix packages/contracts build
      - name: Install and generate API client
        run: |
          npm ci --prefix apps/api
          npm run --prefix apps/api generate
      - name: Regenerate OpenAPI and commit exact artifact
        run: |
          npm run --prefix apps/api openapi
          if git diff --quiet -- docs/openapi-foundation.json; then
            echo "OpenAPI already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi-foundation.json
          git commit -m "docs(api): synchronize generated OpenAPI"
          git push origin HEAD:feat/logistics-shipment-execution-l2-20261020
