        lotNumber: { type: string }
        quantity: { $ref: "#/components/schemas/Quantity" }
        kind: { type: string }
        isQuarantined: { type: boolean }
        expired: { type: boolean }
        expiryDate: { type: string }
        location: { type: string }
        supplierName: { type: string }
        variantId: { type: string }

    ReceiptRow:
