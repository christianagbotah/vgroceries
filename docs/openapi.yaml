    AdjustmentRow:
      type: object
      properties:
        id: { type: string }
        productName: { type: string }
        variantName: { type: string }
        lotNumber: { type: string }
        delta: { type: string }
        reason: { type: string }
        status: { type: string }
        requestedBy: { type: string }
        approvedBy: { type: string }
        atLabel: { type: string }

    StocktakeRow:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        status: { type: string }
        openedAtLabel: { type: string }
        closedAt: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              variantId: { type: string }
              productName: { type: string }
              expectedQty: { $ref: "#/components/schemas/Quantity" }
              countedQty: { $ref: "#/components/schemas/Quantity" }
              variance: { type: string }
              status: { type: string }

    ExpiryOverview:
      type: object
      properties:
        expired:
          type: array
          items: { $ref: "#/components/schemas/LotRow" }
        soon:
          type: array
          items: { $ref: "#/components/schemas/LotRow" }
        quarantined:
