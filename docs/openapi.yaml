components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vg_session
      description: Planned secure HttpOnly web session. Mutations require backend origin/CSRF checks.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token. Role claims drive the permission matrix
        (docs/PERMISSIONS.md); resource ownership is checked server-side for
        customers and riders. Refresh + revocation flows are specified in
        docs/MOBILE_READINESS.md.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: perPage
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 12 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8 }
      description: |
        Client-generated retry key. Same key + same payload replays the
        original result; same key + different payload returns 409
        IDEMPOTENCY_CONFLICT.

  responses:
    NotFound:
      description: Unknown resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Stale state or idempotency conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RuleViolation:
      description: Business rule refused the transition
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable domain code, including operation-specific codes.
          example: OUT_OF_STOCK
        message: { type: string }
        details: {}

    Problem:
      type: object
      required: [type, title, status, code]
      description: Problem details with a stable domain code extension; type is a URI, not the code.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, example: OUT_OF_STOCK }
        details: {}

    Money:
      type: integer
      format: int64
      minimum: 0
      description: GHS minor units (pesewas)

    Quantity:
      type: string
      pattern: '^\d+(\.\d{1,3})?$'
      description: Positive decimal string quantity

    PaymentStatus:
      type: string
      enum: [unpaid, pending, succeeded, failed, expired, partially_refunded, refund_pending, refunded, requires_review]
    FulfilmentStatus:
      type: string
      enum: [awaiting_confirmation, confirmed, picking, packed, dispatched, delivered, ready_for_collection, collected, cancelled]
    DeliveryStatus:
      type: string
      enum: [unassigned, assigned, accepted, picked_up, out_for_delivery, delivered, failed, rescheduled, return_to_store]

    PageMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pages: { type: integer }
        perPage: { type: integer }

    Category:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        tint: { type: string }
        isActive: { type: boolean }
        availableProducts: { type: integer }

    Variant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        unit: { type: string }
        unitSize: { type: string }
        priceMinor: { $ref: "#/components/schemas/Money" }
        priceLabel: { type: string }
        compareAtPriceMinor: { $ref: "#/components/schemas/Money" }
        compareAtLabel: { type: string }
        barcode: { type: string }
        availableToSell: { $ref: "#/components/schemas/Quantity" }
        isAvailable: { type: boolean }
        safetyStock: { $ref: "#/components/schemas/Quantity" }

    Product:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        categoryId: { type: string }
        categoryName: { type: string }
        categorySlug: { type: string }
        shortDescription: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        image: { type: string }
        variants:
          type: array
          items: { $ref: "#/components/schemas/Variant" }
        anyAvailable: { type: boolean }
        minPriceMinor: { $ref: "#/components/schemas/Money" }
        minPriceLabel: { type: string }

    ProductPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Product" }

    ProductPageData:
      type: object
      properties:
        product: { $ref: "#/components/schemas/Product" }
        related:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        purchasable: { type: boolean }

    Zone:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        areas: { type: array, items: { type: string } }
        feeMinor: { $ref: "#/components/schemas/Money" }
        minimumOrderMinor: { $ref: "#/components/schemas/Money" }
        serviceHours: { type: string }
        cutoff: { type: string }
        slotsPerDay: { type: integer }
        isActive: { type: boolean }

    Slot:
      type: object
      properties:
        id: { type: string }
        zoneId: { type: string }
        date: { type: string, format: date }
        window: { type: string }
        capacity: { type: integer }
        booked: { type: integer }

    CartLine:
      type: object
      required: [variantId, quantity]
      properties:
        variantId: { type: string }
        quantity: { $ref: "#/components/schemas/Quantity" }

    QuoteRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CartLine" }
        zoneId: { type: string }

    Quote:
      type: object
      properties:
        ok: { type: boolean }
        lines:
          type: array
          items:
            type: object
            properties:
              variantId: { type: string }
              productId: { type: string }
              productName: { type: string }
              variantName: { type: string }
              unit: { type: string }
              quantity: { $ref: "#/components/schemas/Quantity" }
              unitPriceMinor: { $ref: "#/components/schemas/Money" }
              lineTotalMinor: { $ref: "#/components/schemas/Money" }
              available: { $ref: "#/components/schemas/Quantity" }
              availableNow: { type: boolean }
        subtotalMinor: { $ref: "#/components/schemas/Money" }
        deliveryFeeMinor: { $ref: "#/components/schemas/Money" }
        totalMinor: { $ref: "#/components/schemas/Money" }
        minOrderMinor: { $ref: "#/components/schemas/Money" }
        meetsMinimum: { type: boolean }
        conflicts:
          type: array
          items:
            type: object
            properties:
              variantId: { type: string }
              productName: { type: string }
              variantName: { type: string }
              requested: { $ref: "#/components/schemas/Quantity" }
              available: { $ref: "#/components/schemas/Quantity" }

    CheckoutRequest:
      type: object
      required: [lines, customerName, customerPhone, fulfilment, paymentMethod]
      properties:
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CartLine" }
        customerName: { type: string, minLength: 1 }
        customerPhone: { type: string, minLength: 1 }
        customerEmail: { type: string }
        customerId: { type: string }
        addressId: { type: string }
        guestAddress:
          type: object
          required: [recipientName, phone, locality, street]
          properties:
            recipientName: { type: string }
            phone: { type: string }
            locality: { type: string }
            street: { type: string }
            landmark: { type: string }
            ghanaPostGps: { type: string }
        fulfilment: { type: string, enum: [delivery, collection] }
        zoneId: { type: string }
        slotId: { type: string }
        paymentMethod: { type: string, enum: [mobile_money, card_hosted, bank_transfer, cash_counter, cash_on_delivery] }
        note: { type: string }
        idempotencyKey: { type: string, minLength: 8 }

    CheckoutResult:
      type: object
      properties:
        orderId: { type: string }
        reference: { type: string }
        verificationCode: { type: string }
        paymentRequired: { type: boolean }

    PublicOrder:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        channel: { type: string, enum: [online, pos] }
        customerName: { type: string }
        customerPhone: { type: string }
        fulfilment: { type: string, enum: [delivery, collection] }
        slotLabel: { type: string }
        createdAt: { type: string, format: date-time }
        createdAtLabel: { type: string }
        subtotalMinor: { $ref: "#/components/schemas/Money" }
        discountMinor: { $ref: "#/components/schemas/Money" }
        deliveryFeeMinor: { $ref: "#/components/schemas/Money" }
        totalMinor: { $ref: "#/components/schemas/Money" }
        totalLabel: { type: string }
        paymentMethod: { type: string }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
        fulfilmentStatus: { $ref: "#/components/schemas/FulfilmentStatus" }
        deliveryStatus: { $ref: "#/components/schemas/DeliveryStatus" }
        paymentAttempts:
          type: array
          items: { $ref: "#/components/schemas/PaymentAttempt" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        notes:
          type: array
          items:
            type: object
            properties:
              at: { type: string }
              by: { type: string }
              text: { type: string }
        events:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              atLabel: { type: string }
              actor: { type: string }
              action: { type: string }
              fromStatus: { type: string }
              toStatus: { type: string }
              note: { type: string }
        job: { $ref: "#/components/schemas/OrderJob" }
        returns:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              reference: { type: string }
              status: { type: string }
              createdAt: { type: string, format: date-time }
        posReceiptNo: { type: string }
        stockConsumedAt: { type: string, format: date-time }
        verificationCode: { type: string }

    OrderLine:
      type: object
      properties:
        id: { type: string }
        productName: { type: string }
        variantName: { type: string }
        unit: { type: string }
        quantity: { $ref: "#/components/schemas/Quantity" }
        unitPriceMinor: { $ref: "#/components/schemas/Money" }
        lineTotalMinor: { $ref: "#/components/schemas/Money" }
        allocations:
          type: array
          items:
            type: object
            properties:
              lotId: { type: string }
              quantity: { $ref: "#/components/schemas/Quantity" }
        note: { type: string }
        substitutionOfLineId: { type: string }
        productId: { type: string }
        variantId: { type: string }

    PaymentAttempt:
      type: object
      properties:
        id: { type: string }
        method: { type: string }
        status: { type: string }
        amountMinor: { $ref: "#/components/schemas/Money" }
        amountLabel: { type: string }
        callbackCount: { type: integer }
        providerRef: { type: string }
        settlementState: { type: string }
        failureReason: { type: string }
        createdAt: { type: string, format: date-time }

    OrderJob:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        riderName: { type: string }
        proof: { $ref: "#/components/schemas/Proof" }
        failureReason: { type: string }
        rescheduledFor: { type: string }
        cashToCollectMinor: { $ref: "#/components/schemas/Money" }
        cashToCollectLabel: { type: string }
        cashCollectedAt: { type: string }
        remittedAt: { type: string }

    Proof:
      type: object
      properties:
        method: { type: string, enum: [pin, signature, photo_note] }
        detail: { type: string }
        at: { type: string, format: date-time }

    AccountSummary:
      type: object
      properties:
        customer: { $ref: "#/components/schemas/Customer" }
        addresses:
          type: array
          items: { $ref: "#/components/schemas/Address" }
        ordersCount: { type: integer }
        openOrders: { type: integer }
        returnsCount: { type: integer }
        recentOrders:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              reference: { type: string }
              totalLabel: { type: string }
              fulfilmentStatus: { type: string }
              paymentStatus: { type: string }
              createdAtLabel: { type: string }

    Customer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string }

    Address:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        recipientName: { type: string }
        phone: { type: string }
        locality: { type: string }
        street: { type: string }
        landmark: { type: string }
        ghanaPostGps: { type: string }
        isDefault: { type: boolean }

    AccountOrderRow:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        totalLabel: { type: string }
        fulfilmentStatus: { type: string }
        paymentStatus: { type: string }
        fulfilment: { type: string }
        createdAtLabel: { type: string }
        lineCount: { type: integer }

    ReturnLineEligibility:
      type: object
      properties:
        lineId: { type: string }
        productName: { type: string }
        variantName: { type: string }
        quantity: { $ref: "#/components/schemas/Quantity" }
        returnedSoFar: { $ref: "#/components/schemas/Quantity" }
        eligible: { $ref: "#/components/schemas/Quantity" }
        unitPriceMinor: { $ref: "#/components/schemas/Money" }
        maxRefundMinor: { $ref: "#/components/schemas/Money" }

    AccountReturnRow:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        orderId: { type: string }
        orderReference: { type: string }
        status: { type: string }
        createdAtLabel: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              productName: { type: string }
              quantity: { $ref: "#/components/schemas/Quantity" }
              reason: { type: string }
              refundLabel: { type: string }
        refund:
          type: object
          properties:
            id: { type: string }
            status: { type: string }
            amountMinor: { $ref: "#/components/schemas/Money" }
            method: { type: string }

    ReturnCreated:
      type: object
      properties:
        returnId: { type: string }
        reference: { type: string }
        status: { type: string }

    ReturnDetail:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        orderId: { type: string }
        orderReference: { type: string }
        channel: { type: string }
        status: { type: string }
        requestedBy: { type: string }
        evidenceNote: { type: string }
        createdAtLabel: { type: string }
        receivedAt: { type: string }
        inspectedAt: { type: string }
        disposition:
          type: object
          properties:
            kind: { type: string }
            note: { type: string }
            by: { type: string }
            at: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              productName: { type: string }
              variantName: { type: string }
              quantity: { $ref: "#/components/schemas/Quantity" }
              reason: { type: string }
              requestedRefundLabel: { type: string }
              approvedRefundLabel: { type: string }
        refunds:
          type: array
          items: { $ref: "#/components/schemas/RefundRow" }

    ReturnAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve, reject, receive, inspect, request_refund, retry_refund] }
        disposition: { type: string, enum: [restock_saleable, restock_quarantine, dispose] }
        method: { type: string }
        note: { type: string }

    RefundRow:
      type: object
      properties:
        id: { type: string }
        returnReference: { type: string }
        orderReference: { type: string }
        amountLabel: { type: string }
        status: { type: string }
        method: { type: string }
        reason: { type: string }
        requestedBy: { type: string }
        approvedBy: { type: string }
        providerRef: { type: string }
        providerTransferState: { type: string }
        retryCount: { type: integer }
        createdAtLabel: { type: string }

    PaymentRow:
      type: object
      properties:
        id: { type: string }
        orderReference: { type: string }
        channel: { type: string }
        method: { type: string }
        amountLabel: { type: string }
        status: { type: string }
        providerRef: { type: string }
        settlementState: { type: string }
        callbackCount: { type: integer }
        failureReason: { type: string }
        createdAtLabel: { type: string }
        orderId: { type: string }

    InventoryRow:
      type: object
      properties:
        variantId: { type: string }
        productId: { type: string }
        productName: { type: string }
        variantName: { type: string }
        unit: { type: string }
        sellablePhysical: { $ref: "#/components/schemas/Quantity" }
        reserved: { $ref: "#/components/schemas/Quantity" }
        safetyStock: { $ref: "#/components/schemas/Quantity" }
        availableToSell: { $ref: "#/components/schemas/Quantity" }
        isAvailable: { type: boolean }
        nextExpiry: { type: string }
        lotCount: { type: integer }
        lastMovement: { type: string }
