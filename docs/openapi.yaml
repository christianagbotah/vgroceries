openapi: 3.1.0
info:
  title: Variety Groceries API
  version: 1.0.0
  summary: Proposed production REST API for varietygrocery.com (Ghana)
  description: |
    REST rendering of the service contract the frontend already consumes.

    **Provenance.** The frontend prototype speaks dot-namespaced operations
    (`checkout.complete`, `admin.returns`, …) through the shared adapter
    boundary in `src/services/adapters/`. This document defines the proposed
    production REST surface under `/api/v1` for the NestJS backend, together
    with the error, pagination, idempotency and cache conventions the
    adapters already implement. The complete mapping from the 92 existing
    mock operations to these endpoints is in `docs/API_CONTRACTS.md`.

    **Conventions.**
    - Money: integer minor units (GHS pesewas), never floats.
    - Quantities: decimal strings (`"1.5"`), never floats.
    - Timestamps: UTC ISO-8601.
    - Payment, fulfilment, delivery, return and refund states are separate
      dimensions on every order-bearing resource.
    - Mutations that may be retried accept an `Idempotency-Key` header:
      same key + same payload replays the original result; same key with a
      different payload returns `409 IDEMPOTENCY_CONFLICT`.
    - List endpoints paginate with `page` / `perPage` and return page
      metadata; filters use resource-specific query parameters.
  contact:
    name: Variety Groceries Engineering
    url: https://varietygrocery.com
  license:
    name: Proprietary
servers:
  - url: https://api.varietygrocery.com/api/v1
    description: Proposed production deployment
  - url: http://localhost:4000/api/v1
    description: Planned local NestJS API; the mock route uses a different wire protocol

security:
  - bearerAuth: []
  - sessionCookie: []

tags:
  - { name: Catalog, description: Public catalogue, pricing, availability }
  - { name: Checkout, description: Quotes, delivery configuration, order creation }
  - { name: Orders, description: Public order status and tracking }
  - { name: Account, description: "Customer account: orders, addresses, returns" }
  - { name: Returns, description: Return requests, inspection, dispositions }
  - { name: Refunds, description: Refund ledger, approval, provider execution }
  - { name: Payments, description: Payment attempts and reconciliation }
  - { name: Inventory, description: Lots, movements, reservations, adjustments, stocktakes }
  - { name: POS, description: Counter sales, holds, receipts, cashier sessions }
  - { name: Dispatch, description: Delivery queue, jobs, providers, riders }
  - { name: Rider, description: Rider workspace (mobile-first) }
  - { name: AI, description: Grounded assistance (demo until backend lands) }
  - { name: Admin, description: Staff back-office surfaces }
  - { name: Demo, description: Development-only demo controls }

paths:
  /catalog/categories:
    get:
      tags: [Catalog]
      summary: List active categories with purchasable counts
      operationId: listCategories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
  /catalog/products:
    get:
      tags: [Catalog]
      summary: Search/filter/sort purchasable products
      operationId: listProducts
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search term }
        - { name: category, in: query, schema: { type: string }, description: Category id or slug }
        - { name: sort, in: query, schema: { type: string, enum: [popular, price_asc, price_desc, name, newest], default: popular } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paged product grid (zero-availability items hidden)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
  /catalog/products/{slug}:
    get:
      tags: [Catalog]
      summary: Product detail with variants and availability
      operationId: getProduct
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Product page bundle (purchasable=false when out of stock)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPageData" }
        "404": { $ref: "#/components/responses/NotFound" }
  /catalog/home:
    get:
      tags: [Catalog]
      summary: Storefront homepage bundle (categories, offers, popular, trending)
      operationId: catalogHome
      responses:
        "200":
          description: Homepage bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
                  offers:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  popular:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  trendingNew:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
  /catalog/products:by-variants:
    post:
      tags: [Catalog]
      summary: Resolve products for a set of variant ids
      operationId: productsByVariants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantIds]
              properties:
                variantIds: { type: array, items: { type: string }, minItems: 1 }
      responses:
        "200":
          description: Products owning the requested variants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }

  /checkout/quote:
    post:
      tags: [Checkout]
      summary: Price a basket with live availability and zone fee
      operationId: quoteCart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "200":
          description: Quoted totals with per-line conflicts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /checkout/complete:
    post:
      tags: [Checkout]
      summary: Create an order (reservations held atomically)
      description: |
        Idempotent by `Idempotency-Key`. An identical retry returns the
        original order; a reused key with different input returns
        `409 IDEMPOTENCY_CONFLICT`. Stock is reserved atomically across all
        lines or the request fails with `OUT_OF_STOCK` and nothing is held.
      operationId: completeCheckout
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /checkout/zones:
    get:
      tags: [Checkout]
      summary: Active delivery zones
      operationId: listZones
      responses:
        "200":
          description: Zone list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zone" }
  /checkout/zones/{zoneId}/slots:
    get:
      tags: [Checkout]
      summary: Bookable delivery slots for a zone
      operationId: listSlots
      parameters:
        - { name: zoneId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Slot list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Slot" }

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Public order status (customer-safe projection)
      operationId: getOrderStatus
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Order with separate payment/fulfilment/delivery states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicOrder" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/track:
    post:
      tags: [Orders]
      summary: Track by order reference + verification code
      operationId: trackOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, code]
              properties:
                reference: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Matching order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicOrder" }
        "422": { $ref: "#/components/responses/RuleViolation" }
  /orders/{orderId}/payment-outcome:
    post:
      tags: [Payments]
      summary: Provider callback — record a payment outcome
      description: |
        Duplicate-safe: a second callback for an already-resolved attempt is
        acknowledged (`duplicate: true`) without changing state. A late
        success after failure/review triggers the documented review flow.
      operationId: recordPaymentOutcome
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, outcome]
              properties:
                orderId: { type: string }
                outcome: { type: string, enum: [succeeded, failed, pending] }
                providerRef: { type: string }
      responses:
        "200":
          description: Outcome recorded (or duplicate acknowledged)
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicate: { type: boolean }
                  paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
        "422": { $ref: "#/components/responses/RuleViolation" }

  /account/summary:
    get:
      tags: [Account]
      summary: Customer snapshot (profile, addresses, counters, recent orders)
      operationId: getAccountSummary
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSummary" }
  /account/orders:
    get:
      tags: [Account]
      summary: Customer order history
      operationId: listAccountOrders
      responses:
        "200":
          description: Order rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountOrderRow" }
  /account/orders/{orderId}/cancel:
    post:
      tags: [Account]
      summary: Cancel an order before stock consumption
      description: Cancelling a paid order creates a linked executable refund; the payment only becomes `refunded` after a confirmed provider transfer.
      operationId: cancelAccountOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  fulfilmentStatus: { $ref: "#/components/schemas/FulfilmentStatus" }
        "409": { $ref: "#/components/responses/Conflict" }
  /account/orders/{orderId}/return-lines:
    post:
      tags: [Returns]
      summary: Eligible return lines with remaining balances
      operationId: listReturnLines
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Eligibility rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReturnLineEligibility" }
  /account/returns:
    get:
      tags: [Returns]
      summary: Customer return requests
      operationId: listAccountReturns
      responses:
        "200":
          description: Return rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountReturnRow" }
    post:
      tags: [Returns]
      summary: Create a return request
      description: |
        Lines are aggregated per original order line; quantities beyond the
        remaining eligible balance (prior returns included) are rejected
        before any mutation.
      operationId: createReturn
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, lines]
              properties:
                orderId: { type: string }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [orderLineId, quantity, reason]
                    properties:
                      orderLineId: { type: string }
                      quantity: { $ref: "#/components/schemas/Quantity" }
                      reason: { type: string, minLength: 1 }
                evidenceNote: { type: string }
      responses:
        "201":
          description: Return request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnCreated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /returns/{returnId}:
    get:
      tags: [Returns]
      summary: Return detail (account + staff view)
      operationId: getReturn
      parameters:
        - { name: returnId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Return detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /returns/{returnId}/actions:
    post:
      tags: [Returns]
      summary: Advance a return (approve/receive/inspect/request_refund)
      description: |
        Dispositions are once-only: a repeated inspection replays the
        recorded result without a second stock movement; a disposition
        change explicitly reverses the prior stock effect.
      operationId: returnAction
      parameters:
        - { name: returnId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnAction" }
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                type: object
                properties: { done: { type: boolean } }
        "422": { $ref: "#/components/responses/RuleViolation" }

  /refunds:
    get:
      tags: [Refunds]
      summary: Refund ledger
      operationId: listRefunds
      responses:
        "200":
          description: Refund rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RefundRow" }
  /refunds/{refundId}/actions:
    post:
      tags: [Refunds]
      summary: Approve/execute/retry a refund
      description: |
        Execution revalidates both the return-level refundable balance and
        the order-level paid balance (completed refunds + unresolved
        commitments). Retrying an in-flight attempt continues it; a
        succeeded refund cannot be executed again.
      operationId: refundAction
      parameters:
        - { name: refundId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, execute, retry] }
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                type: object
                properties: { done: { type: boolean } }
        "409": { $ref: "#/components/responses/Conflict" }
  /payments:
    get:
      tags: [Payments]
      summary: Payment attempts ledger with settlement states
      operationId: listPayments
      responses:
        "200":
          description: Payment rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentRow" }

  /inventory/overview:
    get:
      tags: [Inventory]
      summary: Availability per variant (physical/reserved/available)
      operationId: inventoryOverview
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: filter, in: query, schema: { type: string, enum: [low, zero, expiring, all], default: all } }
      responses:
        "200":
          description: Overview rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryRow" }
                  total: { type: integer }
  /inventory/lots:
    get:
      tags: [Inventory]
      summary: Lot-level stock (FEFO data)
      operationId: listLots
      parameters:
        - { name: variantId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Lot rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LotRow" }
  /inventory/lots/{lotId}/quarantine:
    post:
      tags: [Inventory]
      summary: Quarantine or release a lot
      operationId: quarantineLot
      parameters:
        - { name: lotId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [quarantine]
              properties:
                quarantine: { type: boolean }
                note: { type: string }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties: { done: { type: boolean } }
  /inventory/lots/{lotId}/dispose:
    post:
      tags: [Inventory]
      summary: Dispose a lot (damaged/expired)
      operationId: disposeLot
      parameters:
        - { name: lotId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties: { done: { type: boolean } }
  /inventory/receipts:
    get:
      tags: [Inventory]
      summary: Goods receipts
      operationId: listReceipts
      responses:
        "200":
          description: Receipt rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReceiptRow" }
  /inventory/receive:
    post:
      tags: [Inventory]
      summary: Receive goods into lots (PO-matching)
      operationId: receiveGoods
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiveRequest" }
      responses:
        "201":
          description: Receipt created
          content:
            application/json:
              schema:
                type: object
                properties: { receiptId: { type: string } }
  /inventory/adjustments:
    get:
      tags: [Inventory]
      summary: Adjustment requests
      operationId: listAdjustments
      responses:
        "200":
          description: Adjustment rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdjustmentRow" }
  /inventory/adjustments/create:
    post:
      tags: [Inventory]
      summary: Request an adjustment (approval-gated)
      operationId: createAdjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [variantId, delta, reason]
                    properties:
                      variantId: { type: string }
                      lotId: { type: string }
                      delta: { type: string, pattern: '^[+-]?\\d+(\\.\\d{1,3})?$' }
                      reason: { type: string }
                      note: { type: string }
      responses:
        "201":
          description: Adjustment requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  adjustmentId: { type: string }
                  status: { type: string }
  /inventory/adjustments/decide:
    post:
      tags: [Inventory]
      summary: Approve or reject an adjustment
      operationId: decideAdjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adjustmentId, decision]
              properties:
                adjustmentId: { type: string }
                decision: { type: string, enum: [approve, reject] }
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string } }
  /inventory/stocktakes:
    get:
      tags: [Inventory]
      summary: Stocktake list
      operationId: listStocktakes
      responses:
        "200":
          description: Stocktake rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StocktakeRow" }
  /inventory/stocktakes/open:
    post:
      tags: [Inventory]
      summary: Open a stocktake for selected variants
      operationId: openStocktake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantIds]
              properties:
                variantIds: { type: array, items: { type: string }, minItems: 1 }
      responses:
        "201":
          description: Stocktake opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  stocktakeId: { type: string }
                  reference: { type: string }
  /inventory/stocktakes/count:
    post:
      tags: [Inventory]
      summary: Record counts
      operationId: recordCounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stocktakeId, counts]
              properties:
                stocktakeId: { type: string }
                counts:
                  type: object
                  additionalProperties: { $ref: "#/components/schemas/Quantity" }
      responses:
        "200":
          description: Counts recorded
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string } }
  /inventory/stocktakes/close:
    post:
      tags: [Inventory]
      summary: Close a stocktake (optionally apply corrections)
      operationId: closeStocktake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stocktakeId, applyCorrections]
              properties:
                stocktakeId: { type: string }
                applyCorrections: { type: boolean }
      responses:
        "200":
          description: Stocktake closed
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string } }
  /inventory/expiry:
    get:
      tags: [Inventory]
      summary: Expiry, quarantine and damaged lot overview
      operationId: expiryOverview
      responses:
        "200":
          description: Expiry buckets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpiryOverview" }

  /pos/search:
    get:
      tags: [POS]
      summary: Find sellable variants (barcode or name)
      operationId: posSearch
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Search rows with live availability
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PosSearchRow" }
  /pos/complete:
    post:
      tags: [POS]
      summary: Complete a counter sale (idempotent)
      description: |
        Idempotent by `Idempotency-Key`. Quantities must be positive decimal
        strings; cash sales require `cashReceivedMinor` >= total; payment
        methods are restricted to the counter-supported set. Reservations
        are created and consumed atomically — the same stock-depletion
        invariant as online checkout.
      operationId: posComplete
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosSaleRequest" }
      responses:
        "201":
          description: Sale completed with receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSaleResult" }
        "409": { $ref: "#/components/responses/Conflict" }
  /pos/holds:
    post:
      tags: [POS]
      summary: Hold a basket as a draft
      operationId: posHold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, lines]
              properties:
                sessionId: { type: string }
                label: { type: string }
                lines:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/CartLine" }
      responses:
        "201":
          description: Draft held
          content:
            application/json:
              schema:
                type: object
                properties:
                  draftId: { type: string }
                  label: { type: string }
                  expiresAt: { type: string }
  /pos/drafts:
    get:
      tags: [POS]
      summary: List held drafts for a session
      operationId: listPosDrafts
      parameters:
        - { name: sessionId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Draft rows
          content:
            application/json:
              schema:
