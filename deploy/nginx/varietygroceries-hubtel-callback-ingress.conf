# Variety Groceries: Hubtel Online Checkout payment callback ingress.
# Include *inside* the HTTPS server block for portal.varietygroceries.com.
# Hubtel's published callback source for Online Checkout: 108.129.40.25
# Official guide: https://code.hubtel.com/docs/callbacks
#
# The browser return URL is NOT a payment callback. Only matching signed (when
# available) or provider-looked-up evidence can update payment status.
# Keep callback outside the staff web login proxy, but never expose POST
# handlers to the wider Internet.
location = /api/v1/payments/providers/hubtel/events {
    # Exact route prevents bypasses through the general /api/v1/ proxy.
    # Source addresses MUST NOT be read from caller-controlled X-Forwarded-For.
    allow 108.129.40.25;
    deny all;

    limit_except POST { deny all; }
    client_max_body_size 64k;
    client_body_timeout 10s;

    proxy_pass http://127.0.0.1:3049;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 15s;
    proxy_request_buffering on;
}
