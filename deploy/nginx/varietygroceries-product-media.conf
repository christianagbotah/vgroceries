# Include inside the HTTPS server block for portal.varietygroceries.com.
# Only immutable approved media under the public subtree is exposed.
location ^~ /media/products/ {
    alias /home/lightworld/data/varietygroceries/product-media/public/;
    autoindex off;
    etag on;

    limit_except GET HEAD {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Defense in depth: never map review/private namespaces to HTTP.
location ~ ^/media/(?:private|draft|review)/ {
    return 404;
}
